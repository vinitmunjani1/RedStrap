<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}REDSTRAP{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        /* Design tokens */
        :root {
            --bg-primary: #050915;
            --bg-elevated: rgba(18, 26, 46, 0.7);
            --bg-surface: rgba(26, 38, 66, 0.55);
            --bg-surface-strong: rgba(38, 51, 82, 0.7);
            --glass-bg: rgba(22, 31, 54, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --border-color: rgba(148, 163, 184, 0.18);
            --border-strong: rgba(255, 255, 255, 0.25);

            --text-primary: #e8edf6;
            --text-secondary: #c7d1e3;
            --text-muted: #9aa7bf;

            --accent-primary: #7c7dff;
            --accent-secondary: #a879ff;
            --accent-tertiary: #5ed4ff;
            --accent-success: #3dd598;
            --accent-info: #58b7ff;
            --accent-warning: #f7c266;
            --accent-danger: #ff7b7b;

            --shadow-sm: 0 10px 30px rgba(0, 0, 0, 0.35);
            --shadow-md: 0 18px 50px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 28px 80px rgba(0, 0, 0, 0.55);

            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --radius-xl: 22px;

            --font-sans: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-7: 28px;
            --space-8: 32px;
        }

        * {
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        body {
            background: radial-gradient(circle at 20% 20%, rgba(124, 125, 255, 0.08), transparent 25%),
                        radial-gradient(circle at 80% 0%, rgba(94, 212, 255, 0.07), transparent 25%),
                        radial-gradient(circle at 50% 80%, rgba(168, 121, 255, 0.06), transparent 28%),
                        var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            letter-spacing: 0.01em;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            color: var(--text-primary);
        }

        h1 { font-size: 2.35rem; letter-spacing: -0.02em; }
        h2 { font-size: 1.95rem; letter-spacing: -0.015em; }
        h3 { font-size: 1.6rem; letter-spacing: -0.01em; }

        p, small, span, label {
            color: var(--text-secondary);
        }

        a {
            color: var(--accent-primary);
            text-decoration: none;
        }
        a:hover {
            color: var(--accent-secondary);
        }
        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 2px solid rgba(124, 125, 255, 0.35);
            outline-offset: 2px;
            border-color: rgba(124, 125, 255, 0.4);
            box-shadow: 0 0 0 6px rgba(124, 125, 255, 0.15);
        }

        .navbar {
            background: linear-gradient(120deg, rgba(22, 31, 54, 0.9), rgba(12, 17, 31, 0.9)) !important;
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--shadow-md);
            padding: 0.9rem 0;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--text-primary) !important;
            letter-spacing: -0.015em;
        }

        .nav-link {
            color: var(--text-secondary) !important;
            font-weight: 600;
            margin: 0 0.35rem;
            padding: 0.55rem 1rem !important;
            border-radius: var(--radius-md);
        }
        .nav-link:hover {
            background: rgba(124, 125, 255, 0.12);
            color: var(--text-primary) !important;
        }
        .nav-link.active {
            background: rgba(124, 125, 255, 0.18);
            color: var(--text-primary) !important;
            border: 1px solid rgba(124, 125, 255, 0.25);
        }

        .container {
            color: var(--text-primary);
            max-width: 1280px;
        }

        .card, .glass-card {
            background: var(--bg-elevated);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            color: var(--text-primary);
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(26, 38, 66, 0.85), rgba(38, 51, 82, 0.72));
        }
        .card:hover, .glass-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: rgba(124, 125, 255, 0.35);
        }

        .card-img-top {
            border-radius: var(--radius-md);
            max-height: 320px;
            object-fit: cover;
        }

        .btn {
            border-radius: var(--radius-md);
            padding: 0.65rem 1.45rem;
            font-weight: 600;
            border: 1px solid transparent;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary {
            background: linear-gradient(135deg, rgba(124, 125, 255, 0.9), rgba(168, 121, 255, 0.85));
            color: #0b0f1e;
            border-color: transparent;
            box-shadow: 0 10px 30px rgba(124, 125, 255, 0.3);
        }
        .btn-outline-primary {
            border: 1.5px solid rgba(124, 125, 255, 0.6);
            color: var(--text-primary);
            background: rgba(124, 125, 255, 0.08);
        }
        .btn-outline-primary:hover {
            background: rgba(124, 125, 255, 0.18);
            border-color: rgba(124, 125, 255, 0.8);
        }
        .btn-secondary {
            background: rgba(94, 212, 255, 0.16);
            border: 1px solid rgba(94, 212, 255, 0.28);
            color: var(--accent-tertiary);
        }
        .btn-danger {
            background: rgba(255, 123, 123, 0.16);
            border: 1px solid rgba(255, 123, 123, 0.28);
            color: var(--accent-danger);
        }

        .alert {
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            background: var(--bg-surface);
        }
        .alert-success { border-color: rgba(61, 213, 152, 0.4); color: var(--accent-success); }
        .alert-danger, .alert-error { border-color: rgba(255, 123, 123, 0.4); color: var(--accent-danger); }
        .alert-info { border-color: rgba(88, 183, 255, 0.35); color: var(--accent-info); }

        .list-group-item {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm) !important;
            color: var(--text-primary);
        }
        .list-group-item:hover {
            border-color: rgba(124, 125, 255, 0.35);
            background: var(--bg-surface-strong);
        }

        .form-control, .form-select {
            background: rgba(22, 31, 54, 0.7);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem;
            color: var(--text-primary);
        }
        .form-control:focus, .form-select:focus {
            background: rgba(26, 38, 66, 0.9);
            border-color: rgba(124, 125, 255, 0.5);
            box-shadow: 0 0 0 4px rgba(124, 125, 255, 0.15);
        }
        .form-control::placeholder { color: var(--text-muted); }
        .form-label { color: var(--text-secondary); font-weight: 600; }

        .badge {
            padding: 0.45rem 0.75rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            letter-spacing: 0.01em;
        }
        .badge.bg-primary { background-color: rgba(124, 125, 255, 0.2) !important; color: var(--text-primary); }
        .badge.bg-secondary { background-color: rgba(22, 31, 54, 0.5) !important; }
        .badge.bg-success { background-color: rgba(61, 213, 152, 0.16) !important; color: var(--accent-success); }
        .badge.bg-danger { background-color: rgba(255, 123, 123, 0.2) !important; color: var(--accent-danger); }

        .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }

        .dropdown-menu-dark {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
        }
        .dropdown-item {
            color: var(--text-primary);
        }
        .dropdown-item:hover {
            background-color: rgba(124, 125, 255, 0.12);
            color: var(--text-primary);
        }
        .dropdown-divider { border-color: var(--border-color); }

        /* Engagement & stats refinements */
        .engagement-compact {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            padding: 0.3rem 0.55rem;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
        }
        .engagement-compact i { opacity: 0.9; }

        .stat-card {
            background: linear-gradient(135deg, rgba(124, 125, 255, 0.5), rgba(168, 121, 255, 0.55));
            color: white;
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: var(--shadow-md);
        }
        .stat-card h5 {
            opacity: 0.92;
            font-size: 0.9rem;
            letter-spacing: 0.6px;
        }
        .stat-card h2 {
            font-size: 2.35rem;
            margin: 0;
        }

        /* Table, modal, footer */
        .table {
            color: var(--text-secondary);
        }
        .table thead {
            color: var(--text-primary);
        }
        .modal-content {
            background: linear-gradient(135deg, rgba(18, 26, 46, 0.95), rgba(10, 14, 26, 0.95));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            color: var(--text-primary);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); }
        ::-webkit-scrollbar-thumb { background: rgba(124, 125, 255, 0.35); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(124, 125, 255, 0.55); }

        /* Utility */
        .surface-strong { background: var(--bg-surface-strong); }
        .shadow-md { box-shadow: var(--shadow-md); }
        .shadow-lg { box-shadow: var(--shadow-lg); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">
                <i class="bi bi-graph-up-arrow"></i> REDSTRAP
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        <a class="nav-link" href="{% url 'dashboard' %}"><i class="bi bi-house"></i> New</a>
                        <a class="nav-link" href="{% url 'social_dashboard' %}"><i class="bi bi-people"></i> Social</a>
                        <a class="nav-link" href="{% url 'posts' %}"><i class="bi bi-images"></i> content</a>
                        <a class="nav-link" href="{% url 'reddit' %}"><i class="bi bi-reddit"></i> Reddit</a>
       
                        <!-- <a class="nav-link" href="{% url 'twitter_accounts' %}"><i class="bi bi-twitter"></i> Twitter</a>
                        <a class="nav-link" href="{% url 'twitter_tweets' %}"><i class="bi bi-chat-quote"></i> Tweets</a> -->
                        
                        <a class="nav-link" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right"></i> Logout</a>
                    {% else %}
                        <a class="nav-link" href="{% url 'login' %}"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                        <a class="nav-link" href="{% url 'register' %}"><i class="bi bi-person-plus"></i> Register</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4 mb-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    <i class="bi bi-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' or message.tags == 'danger' %}exclamation-triangle{% else %}info-circle{% endif %}"></i>
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</body>
</html>
